<div class="container">
    <!-- واجهة تسجيل الدخول -->
    <div id="loginSection">
        <h1>🛡️ الحملة التوعوية</h1>
        <p style="text-align: center;">الرجاء إدخال بياناتك الشخصية للمتابعة واستعراض المحتوى الأمني.</p>
        
        <div class="form-group">
            <label for="userName">الاسم:</label>
            <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        </div>

        <div class="form-group">
            <label for="userCategory">الفئة:</label>
            <select id="userCategory">
                <option value="" disabled selected>... اختر الفئة</option>
                <option value="طالب">طالب</option>
                <option value="معلم">معلم</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <button onclick="showAlert()">دخول</button>
    </div>

    <!-- واجهة رسالة هكررتك (مخفية افتراضياً ولن تظهر إلا بعد الضغط على دخول) -->
    <div id="resultSection">
        <h1 style="text-align: center; color: #ff6b6b; font-size: 30px;">⚠️ هكررتك!</h1>
        <p style="text-align: center;">لو كان هجوم احتيال حقيقي، كانت بياناتك بيد المحتال الحين!</p>
        
        <div class="alert-box">
            <strong style="font-size: 18px; color: #ffffff;">البيانات اللي "سُرقت" منك:</strong>
            <div id="displayData" class="data-display"></div>
        </div>
        
        <p style="text-align: center; font-size: 16px; color: #cbd5e1;">✔️ تأكد دائماً من مصدر أي رابط قبل ما تفتحه أو تدخل بياناتك فيه.</p>
    </div>
</div>

<script>
    function showAlert() {
        const name = document.getElementById('userName').value;
        const category = document.getElementById('userCategory').value;

        if(!name || !category) {
            alert('الرجاء إدخال الاسم واختيار الفئة أولاً');
            return;
        }

        document.getElementById('displayData').innerHTML = `👤 <b>الاسم:</b> ${name}<br>🎓 <b>الفئة:</b> ${category}`;

        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
    }
</script>
