<div class="container">
    <!-- واجهة تسجيل الدخول -->
    <div id="loginSection">
        <h1>🛡️ الحملة التوعوية</h1>
        <p>الرجاء إدخال بياناتك الشخصية للمتابعة واستعراض المحتوى الأمنى.</p>
        
        <div class="form-group">
            <label for="userName">الاسم:</label>
            <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        </div>

        <div class="form-group">
            <label for="userCategory">الفئة:</label>
            <select id="userCategory">
                <option value="" disabled selected>... اختر الفئة</option>
                <option value="طالب">طالب</option>
                <option value="معلم">معلم</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <button onclick="showAlert()">دخول</button>
    </div>

    <!-- واجهة رسالة هكررتك (مخفية افتراضياً) -->
    <div id="resultSection">
        <h1>⚠️ هكررتك!</h1>
        <p>لو كان هجوم احتيال حقيقي، كانت بياناتك بيد المحتال الحين!</p>
        <p><strong>البيانات اللي "سُرقت" منك:</strong></p>
        <p id="displayData" style="text-align: right; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;"></p>
        <p>✔️ تأكد دائماً من مصدر أي رابط قبل ما تفتحه أو تدخل بياناتك فيه.</p>
    </div>
</div>

<script>
    function showAlert() {
        const name = document.getElementById('userName').value;
        const category = document.getElementById('userCategory').value;

        if(!name || !category) {
            alert('الرجاء إدخال الاسم واختيار الفئة أولاً');
            return;
        }

        // عرض البيانات المسروقة
        document.getElementById('displayData').innerHTML = `👤 الاسم: ${name}<br>🎓 الفئة: ${category}`;

        // إخفاء نموذج الدخول وإظهار صفحة التوعية
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
    }
</script>
